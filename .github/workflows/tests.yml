name: tests

# Every push and every PR. The suite is ~2s and needs no services, so there is
# no reason to narrow this to selected branches.
# List form deliberately: in YAML 1.1 a bare `on:` key parses as the boolean
# `true`, which GitHub tolerates but every other YAML tool does not.
on: [push, pull_request]

jobs:
  suite:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor and the ceiling. `pyproject.toml` claims
        # `requires-python = ">=3.9"` and until now nothing checked it; 3.9 is
        # here to keep that claim honest rather than aspirational.
        python: ["3.9", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          path: amap-router-local

      # The conformance tests validate against the spec's fixtures and schemas.
      # `helpers._spec_root()` deliberately refuses to turn a missing checkout
      # into a skip -- see its docstring, and the commit titled "The one test
      # that checks the real connector was silently skipping"), which ruled
      # that a probe which stops running is worse than one that fails. So CI
      # SUPPLIES the spec rather than routing around its absence.
      - uses: actions/checkout@v4
        with:
          repository: proofpoint/amap-spec
          path: amap-spec

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Editable, always -- per CLAUDE.md. A copy install puts a second router
      # under site-packages and makes "which copy is running" ambiguous.
      - name: install (editable)
        working-directory: amap-router-local
        run: pip install -e .

      # Named separately from the suite it is already part of, on purpose: a
      # red X on this step says "a live workspace identifier is in the tree",
      # which is a different emergency from "a test broke". Costs ~0.3s.
      # It remains a tripwire, not a certificate -- read its docstring.
      - name: tripwire -- no live identifiers
        working-directory: amap-router-local
        env:
          AMAP_SPEC_REPO: ${{ github.workspace }}/amap-spec
        run: python -m unittest router.tests.test_no_live_identifiers -v

      # `unittest`, not `pytest`: installing a test runner would mean this job
      # no longer demonstrates what `dependencies = []` asserts. The suite is
      # standard-library only and this run is the proof.
      #
      # AMAP_SPEC_REPO is set explicitly even though the checkout layout above
      # would also satisfy `_spec_root()`'s by-name sibling lookup. Relying on
      # that would make a future failure ambiguous between "the spec changed"
      # and "the workspace layout drifted".
      - name: suite
        working-directory: amap-router-local
        env:
          AMAP_SPEC_REPO: ${{ github.workspace }}/amap-spec
        run: python -m unittest discover -s router/tests -t .
