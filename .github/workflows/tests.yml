name: tests

# List form deliberately: in YAML 1.1 a bare `on:` key parses as the boolean
# `true`, which GitHub tolerates but every other YAML tool does not.
on: [push, pull_request]

jobs:
  suite:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor and the ceiling. `pyproject.toml` claims
        # `requires-python = ">=3.9"` and until this job ran, nothing checked it.
        python: ["3.9", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          path: amap-router-local

      # PHASE 1. The conformance tests validate against the spec's fixtures and
      # schemas, and `helpers._spec_root()` deliberately refuses to turn a
      # missing checkout into a silent skip -- it returns a path that does not
      # exist so those tests ERROR loudly. That behaviour is unchanged and must
      # stay: a probe that stops running is worse than one that fails.
      #
      # What IS true right now is that this job cannot obtain the spec at all.
      # `proofpoint/amap-spec` is PRIVATE and a workflow's default GITHUB_TOKEN
      # is scoped to the repository it runs in -- same org is not same repo.
      # This job asserted otherwise when it was written and was red from its
      # first run onward, while the suite was reported green from developer
      # checkouts. A check that cannot run, taken for one that works.
      #
      # So: attempt the checkout, and BRANCH ON WHETHER IT WORKED. When
      # amap-spec goes public this step succeeds and the full suite runs with
      # no edit to this file -- the workflow tests the condition rather than
      # hardcoding the phase.
      - uses: actions/checkout@v4
        id: spec
        continue-on-error: true
        with:
          repository: proofpoint/amap-spec
          path: amap-spec

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Editable, always -- a copy install puts a second router under
      # site-packages and makes "which copy is running" ambiguous.
      - name: install (editable)
        working-directory: amap-router-local
        run: pip install -e .

      # `unittest`, not `pytest`: installing a test runner would mean this job
      # no longer demonstrates what `dependencies = []` asserts.
      - name: suite
        working-directory: amap-router-local
        env:
          AMAP_SPEC_REPO: ${{ github.workspace }}/amap-spec
        run: |
          set -eu
          if [ -d "$AMAP_SPEC_REPO/fixtures" ]; then
            echo "spec present -- running the FULL suite including conformance"
            python -m unittest discover -s router/tests -t .
          else
            echo "::warning title=Conformance tests NOT RUN::amap-spec is private and this job's GITHUB_TOKEN cannot read it. 70 of 645 tests, in 6 modules, are not running. Unblock by making proofpoint/amap-spec public, or by supplying a read-only token; then this step runs the full suite with no change to this file."
            echo "PHASE 1: spec unavailable -- 6 conformance modules held back."
            skip="test_attachments_outbound test_happy_path test_outcomes test_peer_fixtures test_peer_routing test_validate_fixtures"
            run=""
            for f in router/tests/test_*.py; do
              base=$(basename "$f" .py)
              case " $skip " in *" $base "*) continue;; esac
              run="$run router.tests.$base"
            done
            # A NEW conformance module will not be in `skip`, so it runs and
            # goes red. That is deliberate: the alternative is silently
            # widening the gap, and a loud red is how someone discovers this
            # job is still in phase 1.
            python -m unittest $run
          fi
